services:
  server:
    build:
      context: .
      target: server
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      WEB_ORIGIN: http://localhost:3000
      API_PORT: "3001"
      LOG_LEVEL: info
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13.0}
      JEV_CHECKPOINT_MS: ${JEV_CHECKPOINT_MS:-5000}
      JEV_TIMEOUT_MS: ${JEV_TIMEOUT_MS:-15000}
      JEV_MAX_ATTEMPTS: ${JEV_MAX_ATTEMPTS:-2}
      POLICY_INCIDENT_PROBABILITY: ${POLICY_INCIDENT_PROBABILITY:-0.8}
      POLICY_CLASSIFICATION_CONFIDENCE: ${POLICY_CLASSIFICATION_CONFIDENCE:-0.75}
      POLICY_INCIDENT_SEVERITY: ${POLICY_INCIDENT_SEVERITY:-2}
    volumes:
      - blackout-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  web:
    build:
      context: .
      target: web
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUBLIC_BACKEND_URL: http://localhost:3001
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  blackout-data:
